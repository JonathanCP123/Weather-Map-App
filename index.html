<!DOCTYPE html>
<html>
<head>
    <title>Unified Weather, Accessibility & Routing Map App</title>
    <style>
        #map {
            height: 100vh;
            width: 100%;
        }
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        
        /* Floating Map Controls */
        #map-controls {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 5;
            background-color: white;
            padding: 16px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.18);
            width: 280px;
            max-height: 90vh;
            overflow-y: auto;
        }
        #map-controls h3 {
            margin: 0 0 8px 0;
            font-size: 15px;
            color: #202124;
        }

        .control-section {
            border-bottom: 1px solid #e8eaed;
            padding-bottom: 12px;
            margin-bottom: 12px;
        }
        .control-section:last-child {
            border-bottom: none;
            padding-bottom: 0;
            margin-bottom: 0;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 8px;
        }
        .input-group input, .input-group select {
            padding: 8px 10px;
            border: 1px solid #dadce0;
            border-radius: 6px;
            font-size: 12px;
            outline: none;
        }
        .input-group input:focus, .input-group select:focus {
            border-color: #4285F4;
        }

        .btn-row {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }
        .btn-primary {
            background: #4285F4;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            flex: 1;
        }
        .btn-primary:hover { background: #1a73e8; }
        .btn-secondary {
            background: #f1f3f4;
            color: #3c4043;
            border: 1px solid #dadce0;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
        }
        .btn-secondary:hover { background: #e8eaed; }

        #route-info {
            display: none;
            background: #e8f0fe;
            border: 1px solid #aecbfa;
            color: #174ea6;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            margin-top: 10px;
            line-height: 1.4;
        }

        /* Weather Marker Styling */
        .weather-marker {
            background: #ffffff;
            color: #222;
            padding: 5px 12px;
            border-radius: 20px;
            border: 2px solid #4285F4;
            font-weight: bold;
            font-size: 13px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.16);
            white-space: nowrap;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .weather-marker:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 14px rgba(66, 133, 244, 0.35);
            border-color: #1a73e8;
        }

        .origin-marker {
            background: #34A853;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 12px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
            white-space: nowrap;
        }

        /* Image 1: Place Card InfoWindow Styling */
        .place-card-popup {
            padding: 4px 6px;
            width: 280px;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #202124;
        }
        .place-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 4px;
        }
        .place-card-title {
            margin: 0;
            font-size: 16px;
            font-weight: 700;
            color: #202124;
            line-height: 1.3;
            flex: 1;
        }
        .place-card-link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: #e0f2fe;
            color: #0284c7;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            flex-shrink: 0;
            transition: background-color 0.2s ease;
        }
        .place-card-link-btn:hover {
            background-color: #bae6fd;
        }
        .place-card-address {
            margin: 0 0 10px 0;
            font-size: 12px;
            color: #5f6368;
            line-height: 1.35;
        }
        .place-card-acc-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #3c4043;
            font-weight: 500;
        }
        .place-card-acc-row .acc-icon {
            font-size: 15px;
            color: #1a73e8;
        }
        .view-weather-btn-link {
            display: block;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid #e8eaed;
            color: #1a73e8;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-align: right;
        }
        .view-weather-btn-link:hover {
            text-decoration: underline;
        }

        /* Image 2: Detailed Weather Card Styling */
        .unified-popup {
            color: #202124;
            width: 310px;
            padding: 4px;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        .place-header {
            border-bottom: 1px solid #e8eaed;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .place-header h3 {
            margin: 0 0 4px 0;
            font-size: 16px;
            color: #1a73e8;
            font-weight: 700;
            line-height: 1.3;
        }
        .place-header p {
            margin: 0;
            font-size: 12px;
            color: #5f6368;
            line-height: 1.35;
        }
        .back-to-place-btn {
            display: inline-block;
            margin-bottom: 6px;
            font-size: 11px;
            color: #1a73e8;
            cursor: pointer;
            font-weight: 600;
        }
        .back-to-place-btn:hover { text-decoration: underline; }

        .accessibility-badge {
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            border-radius: 6px;
            margin-top: 8px;
            font-weight: 500;
        }
        .accessibility-badge.accessible { background-color: #e8f0fe; color: #1967d2; }
        .accessibility-badge.inaccessible { background-color: #fce8e6; color: #c5221f; }
        .accessibility-badge.unknown { background-color: #f1f3f4; color: #5f6368; }

        .weather-section-title {
            font-size: 11px;
            font-weight: 700;
            color: #5f6368;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 10px 0 6px 0;
        }

        .weather-details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            background: #f8f9fa;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            border: 1px solid #f1f3f4;
        }

        .hourly-container {
            display: flex;
            justify-content: space-between;
            gap: 6px;
            margin-top: 8px;
        }
        .hourly-card {
            background: #ffffff;
            border: 1px solid #dadce0;
            border-radius: 8px;
            padding: 8px 4px;
            text-align: center;
            flex: 1;
            font-size: 11px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        .hourly-card .time { font-weight: 600; color: #5f6368; margin-bottom: 4px; font-size: 10px; }
        .hourly-card .icon { font-size: 18px; margin: 2px 0; }
        .hourly-card .temp { color: #202124; font-weight: bold; }
    </style>
</head>
<body>

    <div id="map-controls">
        <div class="control-section">
            <h3>Explore Location</h3>
            <label style="cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 13px;">
                <input type="checkbox" id="toggle-weather" checked>
                <span>Show Weather Pins</span>
            </label>

            <div class="input-group">
                <input type="text" id="city-search-input" placeholder="Search city or place..." />
                <button id="search-btn" class="btn-primary">Search Location</button>
            </div>
        </div>

        <div class="control-section">
            <h3>Get Directions</h3>
            <div class="input-group">
                <input type="text" id="route-origin" placeholder="Origin (e.g. Auckland Central)" />
                <input type="text" id="route-destination" placeholder="Destination (e.g. Westfield Albany)" />
                
                <select id="route-mode">
                    <option value="DRIVING">🚗 Driving (Car)</option>
                    <option value="TRANSIT">🚆 Public Transport</option>
                </select>
            </div>

            <div class="btn-row">
                <button id="get-route-btn" class="btn-primary">Get Route</button>
                <button id="clear-route-btn" class="btn-secondary">Clear</button>
            </div>

            <div id="route-info"></div>
        </div>
    </div>

    <div id="map"></div>

    <script>
        let map;
        let weatherInfoWindow;
        let activeMarkers = [];
        let weatherLayerVisible = true;
        let AdvancedMarkerElement;

        let directionsService;
        let directionsRenderer;
        let placesService;
        let geocoder;

        // Current active place and weather data for toggling views
        let currentPlaceInfo = null;
        let currentWeatherData = null;
        let currentMarker = null;

        function getWeatherIcon(code, rain, isDay = 1) {
            if (rain > 0) return "🌧️";
            if (code >= 95) return "⚡";

            if (isDay === 1) {
                if (code === 0) return "☀️";
                if (code <= 3) return "⛅";
                return "☁️";
            } else {
                if (code === 0) return "🌙";
                if (code <= 3) return "☁️";
                return "☁️";
            }
        }

        function formatHourString(isoStr) {
            if (!isoStr || !isoStr.includes("T")) return "";
            const hour = parseInt(isoStr.split("T")[1].split(":")[0], 10);
            const ampm = hour >= 12 ? 'PM' : 'AM';
            const hour12 = hour % 12 === 0 ? 12 : hour % 12;
            return `${hour12} ${ampm}`;
        }

        function clearMarkers() {
            activeMarkers.forEach(m => m.map = null);
            activeMarkers = [];
        }

        async function initMap() {
            const { Map, InfoWindow } = await google.maps.importLibrary("maps");
            const markerLib = await google.maps.importLibrary("marker");
            await google.maps.importLibrary("routes");

            AdvancedMarkerElement = markerLib.AdvancedMarkerElement;
            weatherInfoWindow = new InfoWindow();

            directionsService = new google.maps.DirectionsService();
            directionsRenderer = new google.maps.DirectionsRenderer({
                suppressMarkers: true,
                polylineOptions: {
                    strokeColor: "#1a73e8",
                    strokeWeight: 6,
                    strokeOpacity: 0.85
                }
            });

            map = new Map(document.getElementById("map"), {
                center: { lat: -36.8485, lng: 174.7633 }, // Auckland, NZ
                zoom: 12,
                mapId: "DEMO_MAP_ID"
            });

            directionsRenderer.setMap(map);

            placesService = new google.maps.places.PlacesService(map);
            geocoder = new google.maps.Geocoder();

            // Map Click Listener
            map.addListener("click", async (mapsMouseEvent) => {
                if (!weatherLayerVisible) return;

                if (weatherInfoWindow) weatherInfoWindow.close();
                clearMarkers();

                // 1. If clicked on a Place / POI Icon
                if (mapsMouseEvent.placeId) {
                    mapsMouseEvent.stop(); // Stop default native Google popup

                    const placeInfo = await getPlaceDetails(mapsMouseEvent.placeId);
                    if (placeInfo) {
                        createWeatherMarker(mapsMouseEvent.latLng, placeInfo, true);
                    } else {
                        handleGeocodeFallback(mapsMouseEvent.latLng);
                    }
                } else {
                    // 2. Clicked on open space
                    handleGeocodeFallback(mapsMouseEvent.latLng);
                }
            });

            // UI Control Event Listeners
            document.getElementById("toggle-weather").addEventListener("change", (e) => {
                weatherLayerVisible = e.target.checked;
                activeMarkers.forEach(m => m.map = weatherLayerVisible ? map : null);
                if (!weatherLayerVisible && weatherInfoWindow) weatherInfoWindow.close();
            });

            document.getElementById("search-btn").addEventListener("click", () => searchLocation(document.getElementById("city-search-input").value));
            document.getElementById("city-search-input").addEventListener("keypress", (e) => { if (e.key === "Enter") searchLocation(e.target.value); });

            document.getElementById("get-route-btn").addEventListener("click", calculateAndDisplayRoute);
            document.getElementById("clear-route-btn").addEventListener("click", clearRoute);
        }

        // Fetch place details using modern Place API with accessibilityOptions
        async function getPlaceDetails(placeId) {
            try {
                const { Place } = await google.maps.importLibrary("places");
                const place = new Place({ id: placeId });
                
                await place.fetchFields({
                    fields: ["displayName", "formattedAddress", "accessibilityOptions", "googleMapsURI"]
                });

                // Extract Name
                let name = "Selected Location";
                if (place.displayName) {
                    name = typeof place.displayName === "object" ? (place.displayName.text || place.displayName) : place.displayName;
                }

                // Extract Wheelchair Accessibility
                let isAccessible = null;
                if (place.accessibilityOptions && place.accessibilityOptions.hasWheelchairAccessibleEntrance !== undefined && place.accessibilityOptions.hasWheelchairAccessibleEntrance !== null) {
                    isAccessible = place.accessibilityOptions.hasWheelchairAccessibleEntrance;
                } else if (place.hasWheelchairAccessibleEntrance !== undefined) {
                    isAccessible = place.hasWheelchairAccessibleEntrance;
                }

                return {
                    id: placeId,
                    name: name,
                    address: place.formattedAddress || "",
                    mapsUri: place.googleMapsURI || `https://www.google.com/maps/place/?q=place_id:${placeId}`,
                    accessibility: isAccessible
                };
            } catch (err) {
                console.warn("Place fetchFields failed, using PlacesService fallback", err);
                return new Promise((resolve) => {
                    placesService.getDetails(
                        { placeId: placeId, fields: ["name", "formatted_address", "url"] },
                        (place, status) => {
                            if (status === google.maps.places.PlacesServiceStatus.OK && place) {
                                resolve({
                                    id: placeId,
                                    name: place.name || "Selected Location",
                                    address: place.formatted_address || "",
                                    mapsUri: place.url || `https://www.google.com/maps/place/?q=place_id:${placeId}`,
                                    accessibility: null
                                });
                            } else {
                                resolve(null);
                            }
                        }
                    );
                });
            }
        }

        // Reverse Geocode for non-POI clicks
        function handleGeocodeFallback(latLng) {
            geocoder.geocode({ location: latLng }, (results, status) => {
                let placeInfo = {
                    name: "Selected Location",
                    address: "",
                    mapsUri: `https://www.google.com/maps/search/?api=1&query=${latLng.lat()},${latLng.lng()}`,
                    accessibility: null
                };

                if (status === "OK" && results && results[0]) {
                    const topResult = results[0];
                    placeInfo.address = topResult.formatted_address;

                    const street = topResult.address_components.find(c => c.types.includes("route"));
                    const area = topResult.address_components.find(c => c.types.includes("sublocality") || c.types.includes("locality"));

                    if (street) {
                        placeInfo.name = street.long_name;
                    } else if (area) {
                        placeInfo.name = area.long_name;
                    } else {
                        placeInfo.name = topResult.address_components[0].long_name;
                    }
                }

                createWeatherMarker(latLng, placeInfo, true);
            });
        }

        function calculateAndDisplayRoute() {
            const origin = document.getElementById("route-origin").value.trim();
            const destination = document.getElementById("route-destination").value.trim();
            const mode = document.getElementById("route-mode").value;
            const routeInfoDiv = document.getElementById("route-info");

            if (!origin || !destination) {
                alert("Please enter both Origin and Destination.");
                return;
            }

            directionsService.route(
                {
                    origin: origin,
                    destination: destination,
                    travelMode: google.maps.TravelMode[mode]
                },
                async (response, status) => {
                    if (status === "OK") {
                        directionsRenderer.setDirections(response);
                        const leg = response.routes[0].legs[0];
                        
                        const modeIcon = mode === 'DRIVING' ? '🚗 Driving' : '🚆 Transit';
                        routeInfoDiv.style.display = "block";
                        routeInfoDiv.innerHTML = `
                            <b>${modeIcon} Route Found:</b><br>
                            ⏱️ <b>Time:</b> ${leg.duration.text}<br>
                            📏 <b>Distance:</b> ${leg.distance.text}
                        `;

                        if (weatherInfoWindow) weatherInfoWindow.close();
                        clearMarkers();

                        // Start Pin
                        const originDiv = document.createElement("div");
                        originDiv.className = "origin-marker";
                        originDiv.innerText = "🟢 Start";
                        const originMarker = new AdvancedMarkerElement({
                            map: map,
                            position: leg.start_location,
                            content: originDiv
                        });
                        activeMarkers.push(originMarker);

                        // Destination Details
                        let destPlaceId = null;
                        if (response.geocoded_waypoints && response.geocoded_waypoints.length > 1) {
                            destPlaceId = response.geocoded_waypoints[response.geocoded_waypoints.length - 1].place_id;
                        }

                        if (destPlaceId) {
                            const placeInfo = await getPlaceDetails(destPlaceId);
                            if (placeInfo) {
                                createWeatherMarker(leg.end_location, placeInfo, true);
                            } else {
                                createWeatherMarker(leg.end_location, { name: destination, address: leg.end_address || "", mapsUri: "", accessibility: null }, true);
                            }
                        } else {
                            createWeatherMarker(leg.end_location, { name: destination, address: leg.end_address || "", mapsUri: "", accessibility: null }, true);
                        }

                    } else {
                        routeInfoDiv.style.display = "none";
                        alert("Could not calculate directions: " + status);
                    }
                }
            );
        }

        function clearRoute() {
            directionsRenderer.setDirections({ routes: [] });
            document.getElementById("route-info").style.display = "none";
            document.getElementById("route-origin").value = "";
            document.getElementById("route-destination").value = "";
            if (weatherInfoWindow) weatherInfoWindow.close();
            clearMarkers();
        }

        async function searchLocation(query) {
            if (!query || !query.trim()) return;
            try {
                const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query.trim())}&count=1&language=en&format=json`;
                const res = await fetch(url);
                const data = await res.json();

                if (!data.results || data.results.length === 0) {
                    alert("Location not found!");
                    return;
                }

                const result = data.results[0];
                const pos = new google.maps.LatLng(result.latitude, result.longitude);

                map.panTo(pos);
                map.setZoom(12);

                if (weatherInfoWindow) weatherInfoWindow.close();
                clearMarkers();

                if (weatherLayerVisible) {
                    createWeatherMarker(pos, { name: result.name, address: result.country || "", mapsUri: "", accessibility: null }, true);
                }
            } catch (err) {
                console.error("Search error:", err);
            }
        }

        async function fetchDetailedWeather(lat, lng) {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,is_day&hourly=temperature_2m,weather_code,precipitation,is_day&timezone=auto`;
            const response = await fetch(url);
            if (!response.ok) throw new Error("Weather fetch failed");
            return await response.json();
        }

        // Global functions to switch between Image 1 (Place Card) and Image 2 (Weather Card)
        window.showPlaceCard = function() {
            if (!currentPlaceInfo) return;
            weatherInfoWindow.setContent(renderPlaceCardHTML(currentPlaceInfo));
        };

        window.showWeatherCard = function() {
            if (!currentPlaceInfo || !currentWeatherData) return;
            weatherInfoWindow.setContent(renderWeatherCardHTML(currentPlaceInfo, currentWeatherData));
        };

        // Renders Image 1: Simple Place Card
        function renderPlaceCardHTML(placeInfo) {
            let accText = "Accessibility status unknown";
            let accIcon = "♿";
            if (placeInfo.accessibility === true) {
                accText = "Accessible entrance";
                accIcon = "♿";
            } else if (placeInfo.accessibility === false) {
                accText = "No accessible entrance";
                accIcon = "🚫";
            }

            const mapsLink = placeInfo.mapsUri ? placeInfo.mapsUri : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(placeInfo.name + ' ' + placeInfo.address)}`;

            return `
                <div class="place-card-popup">
                    <div class="place-card-header">
                        <h3 class="place-card-title">${placeInfo.name}</h3>
                        <a href="${mapsLink}" target="_blank" class="place-card-link-btn" title="Open in Google Maps">↗</a>
                    </div>
                    ${placeInfo.address ? `<div class="place-card-address">${placeInfo.address}</div>` : ''}
                    <div class="place-card-acc-row">
                        <span class="acc-icon">${accIcon}</span>
                        <span>${accText}</span>
                    </div>
                    <div class="view-weather-btn-link" onclick="window.showWeatherCard()">View Weather Forecast ⛅</div>
                </div>
            `;
        }

        // Renders Image 2: Detailed Weather Card
        function renderWeatherCardHTML(placeInfo, weatherData) {
            const current = weatherData.current;
            const temp = Math.round(current.temperature_2m);
            const hourly = weatherData.hourly;

            let accessibilityHTML = "";
            if (placeInfo.accessibility === true) {
                accessibilityHTML = `<div class="accessibility-badge accessible">♿ Accessible entrance</div>`;
            } else if (placeInfo.accessibility === false) {
                accessibilityHTML = `<div class="accessibility-badge inaccessible">🚫 No accessible entrance</div>`;
            } else {
                accessibilityHTML = `<div class="accessibility-badge unknown">♿ Accessibility status unknown</div>`;
            }

            let hourlyHTML = "";
            const currentIsoTime = current.time;
            let startIdx = (hourly && hourly.time) ? hourly.time.findIndex(t => t >= currentIsoTime) : 0;
            if (startIdx === -1) startIdx = 0;

            for (let i = startIdx; i < startIdx + 5 && i < hourly.time.length; i++) {
                const timeLabel = (i === startIdx) ? 'Now' : formatHourString(hourly.time[i]);
                const hTemp = Math.round(hourly.temperature_2m[i]);
                const hCode = hourly.weather_code[i];
                const hRain = hourly.precipitation[i];
                const hIsDay = hourly.is_day[i];
                const hIcon = getWeatherIcon(hCode, hRain, hIsDay);

                hourlyHTML += `
                    <div class="hourly-card">
                        <div class="time">${timeLabel}</div>
                        <div class="icon">${hIcon}</div>
                        <div class="temp">${hTemp}°C</div>
                    </div>
                `;
            }

            return `
                <div class="unified-popup">
                    <div class="place-header">
                        <div class="back-to-place-btn" onclick="window.showPlaceCard()">← Back to Place Info</div>
                        <h3>📍 Destination: ${placeInfo.name}</h3>
                        ${placeInfo.address ? `<p>${placeInfo.address}</p>` : ''}
                        ${accessibilityHTML}
                    </div>
                    
                    <div class="weather-section-title">Current Weather</div>
                    <div class="weather-details-grid">
                        <div><b>Temp:</b> ${temp}°C</div>
                        <div><b>Wind:</b> ${current.wind_speed_10m} km/h</div>
                        <div><b>Humidity:</b> ${current.relative_humidity_2m}%</div>
                        <div><b>Rain:</b> ${current.precipitation} mm</div>
                    </div>

                    <div class="weather-section-title">5-Hour Forecast</div>
                    <div class="hourly-container">${hourlyHTML}</div>
                </div>
            `;
        }

        async function createWeatherMarker(position, placeInfo, autoOpen = true) {
            const markerDiv = document.createElement("div");
            markerDiv.className = "weather-marker";
            markerDiv.innerText = "⏳ Loading...";

            const marker = new AdvancedMarkerElement({
                map: map,
                position: position,
                content: markerDiv,
            });

            activeMarkers.push(marker);

            const lat = typeof position.lat === 'function' ? position.lat() : position.lat;
            const lng = typeof position.lng === 'function' ? position.lng() : position.lng;

            try {
                const weatherData = await fetchDetailedWeather(lat, lng);
                const current = weatherData.current;
                const temp = Math.round(current.temperature_2m);
                const currentIcon = getWeatherIcon(current.weather_code, current.precipitation, current.is_day);

                markerDiv.innerHTML = `${temp}°C ${currentIcon} <span style="font-size: 11px; color: #1a73e8;">ℹ️</span>`;

                currentPlaceInfo = placeInfo;
                currentWeatherData = weatherData;
                currentMarker = marker;

                // Clicking weather marker toggles directly to Image 2 (Weather view)
                markerDiv.addEventListener("click", (e) => {
                    e.stopPropagation();
                    currentPlaceInfo = placeInfo;
                    currentWeatherData = weatherData;
                    currentMarker = marker;
                    window.showWeatherCard();
                    weatherInfoWindow.open(map, marker);
                });

                // Default initial click opens Image 1 (Place Card)
                if (autoOpen) {
                    window.showPlaceCard();
                    weatherInfoWindow.open(map, marker);
                }

                return marker;

            } catch (err) {
                console.error("Weather error:", err);
                markerDiv.innerText = "⚠️ N/A";
            }
        }
    </script>
